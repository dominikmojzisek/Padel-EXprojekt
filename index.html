<body>
<header><div class="row between"><h1 id="title">Padel</h1><div class="sp" id="sp"></div></div></header>
<main id="view"></main>
<nav id="tabs">
  <button data-t="round"><span>🎾</span>Kolo</button>
  <button data-t="players"><span>👥</span>Hráči</button>

<script>
'use strict';
/* =====================  ZÁKLAD A DATA  ===================== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='padel_v1';
try{localStorage.removeItem('padel_nc')}catch(e){}   /* smaže případně uložené přihlašovací údaje z dřívější verze */
const iso=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const czDate=s=>{const a=s.split('-');return Number(a[2])+'. '+Number(a[1])+'. '+a[0]};
const byName=(a,b)=>a.name.localeCompare(b.name,'cs');
const LEVELS=[['Začátečník',800],['Mírně pokročilý',900],['Střední',1000],['Pokročilý',1100],['Výborný',1200]];

/* Hráči jsou společní pro oba sporty; rating, dny (a v nich kola), nastavení a dostupnost má každý sport vlastní. */
const DSET=()=>({courts:0,k:24,win:3,draw:1,loss:0,perPt:0,mode:'bal',hist:'session'});
function defaults(){return{v:2,mod:0,sport:'padel',curBy:{},players:[],rounds:[],sessions:[],cur:null,set:DSET(),set2:DSET()}}
function merge(j){
  const s=Object.assign(defaults(),j);
  s.set=Object.assign(DSET(),j.set||{});s.set2=Object.assign(DSET(),j.set2||{});s.curBy=j.curBy||{};
  if(s.sport!=='squash')s.sport='padel';
  return s;
}
function load(){
  let s=defaults();
  try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&Array.isArray(j.players))s=merge(j)}catch(e){}
  return s;
}
let S=load();
const UI={tab:'round',scope:'ses',lsub:'ladder',sort:'pts',mx:'opp',psort:'name',sel:null,open:{}};
function save(keepMod){if(!keepMod)S.mod=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Nelze uložit data do prohlížeče!')}}
function newSession(name){const s={id:uid(),sport:S.sport,name:name||('Den '+czDate(iso())),date:iso()};S.sessions.push(s);S.cur=s.id;S.curBy[S.sport]=s.id;return s}
function curSes(){return S.sessions.find(s=>s.id===S.cur)}
/* zajistí, že aktuální den patří k vybranému sportu (při přepnutí sportu vrátí naposledy otevřený den) */
function ensureSession(){
  if(!S.curBy)S.curBy={};
  S.sessions.forEach(s=>{
    if(!s.sport)s.sport='padel';   /* data z dřívější verze = padel */
    if(/^Večer /.test(s.name))s.name='Den '+s.name.slice(6);
  });
  const ok=id=>S.sessions.some(s=>s.id===id&&s.sport===S.sport);
  if(!ok(S.cur)){
    if(ok(S.curBy[S.sport]))S.cur=S.curBy[S.sport];
    else{const l=S.sessions.filter(s=>s.sport===S.sport);if(l.length)S.cur=l[l.length-1].id;else newSession()}
  }
  S.curBy[S.sport]=S.cur;
}
ensureSession();
const P=id=>S.players.find(p=>p.id===id);
const nm=id=>{const p=P(id);return p?p.name:'?'};
const isScored=m=>m.sa!=null&&m.sb!=null;
const livePl=()=>S.players.filter(p=>!p.arch);

/* =====================  SPORTY  ===================== */
const SPORTS={padel:{name:'Padel',ico:'🎾',ts:2,unit:'každý vyhraný gem'},squash:{name:'Squash',ico:'⚫',ts:1,unit:'každou vyhranou hru'}};
const SPd=()=>SPORTS[S.sport]||SPORTS.padel;
const TS=()=>SPd().ts;                                   /* velikost týmu: padel 2, squash 1 */
const ST=()=>S.sport==='squash'?S.set2:S.set;            /* nastavení aktuálního sportu */
const ON=()=>S.sport==='squash'?'on2':'on';              /* dostupnost hráče pro aktuální sport */
const R0=p=>S.sport==='squash'?(p.r0s!=null?p.r0s:p.r0):p.r0;   /* výchozí rating pro aktuální sport */
const spRounds=()=>{const ok={};S.sessions.forEach(s=>{if((s.sport||'padel')===S.sport)ok[s.id]=1});return S.rounds.filter(r=>ok[r.sid])};
const avgR=(T,R)=>T.reduce((s,id)=>s+R[id].rating,0)/T.length;
const tName=T=>T.map(nm).join(' + ');

/* =====================  VÝPOČET RATINGU A STATISTIK  ===================== */
/* Všechno se počítá znovu z odehraných zápasů, takže úprava či smazání výsledku
   přepočítá rating i žebříček správně. Rating = Elo pro dvojice (průměr týmu). */
function derive(){
  const R={},SS={},DM={},st=ST();
  const mk=p=>({id:p.id,rating:R0(p),g:0,w:0,d:0,l:0,pts:0,gf:0,ga:0,hist:[R0(p)],pw:{},ow:{},rstart:null});
  S.players.forEach(p=>{R[p.id]=mk(p);SS[p.id]=mk(p)});
  spRounds().forEach(rd=>rd.matches.forEach(m=>{
    if(!isScored(m))return;
    const A=m.a,B=m.b;
    if(!A.concat(B).every(id=>R[id]))return;
    const ra=avgR(A,R),rb=avgR(B,R);
    const ea=1/(1+Math.pow(10,(rb-ra)/400));
    const act=m.sa>m.sb?1:m.sa<m.sb?0:.5;
    const mult=1+Math.min(Math.abs(m.sa-m.sb),12)/24;   /* výraznější výhra = o trochu větší změna */
    const base=st.k*mult*(act-ea);
    const inS=rd.sid===S.cur;
    DM[m.id]={};
    [[A,B,m.sa,m.sb,act,1],[B,A,m.sb,m.sa,1-act,-1]].forEach(([T,O,gf,ga,res,sg])=>{
      T.forEach((id,i)=>{
        const p=R[id],prov=p.g<5?1.5:1,delta=sg*base*prov;   /* nováčci se ladí rychleji */
        const tg=[p];
        if(inS){tg.push(SS[id]);if(SS[id].rstart==null)SS[id].rstart=p.rating}
        tg.forEach(o=>{
          o.g++;if(res===1)o.w++;else if(res===0)o.l++;else o.d++;
          o.gf+=gf;o.ga+=ga;
          o.pts+=(res===1?st.win:res===0?st.loss:st.draw)+gf*st.perPt;
          if(T.length>1){const pa=T[1-i],x=o.pw[pa]||(o.pw[pa]={g:0,w:0});x.g++;x.w+=res}
          O.forEach(q=>{const y=o.ow[q]||(o.ow[q]={g:0,w:0});y.g++;y.w+=res});
        });
        p.rating+=delta;p.hist.push(p.rating);DM[m.id][id]=delta;
      });
    });
  }));
  S.players.forEach(p=>{SS[p.id].rating=R[p.id].rating});
  return{R,SS,DM};
}

/* Kdo s kým (spoluhráč/soupeř) už byl rozlosován. scope: 'ses' | 'all' | undefined (podle nastavení) */
function pairHist(exclude,scope){
  const Pm={},Om={},G={},RS={};
  if(!scope)scope=ST().hist==='session'?'ses':'all';
  const k=(a,b)=>a<b?a+'|'+b:b+'|'+a;
  const inc=(M,a,b)=>{const q=k(a,b);M[q]=(M[q]||0)+1};
  spRounds().forEach(rd=>{
    if(rd.id===exclude)return;
    if(scope==='ses'&&rd.sid!==S.cur)return;
    rd.matches.forEach(m=>{
      if(m.a.length>1){inc(Pm,m.a[0],m.a[1]);inc(Pm,m.b[0],m.b[1])}
      m.a.forEach(x=>m.b.forEach(y=>inc(Om,x,y)));
      m.a.concat(m.b).forEach(x=>G[x]=(G[x]||0)+1);
    });
    (rd.rest||[]).forEach(x=>RS[x]=(RS[x]||0)+1);
  });
  return{P:Pm,O:Om,G,RS,k};
}

/* =====================  LOSOVÁNÍ  ===================== */
function courtsFor(n,override){
  let c=Math.floor(n/(2*TS()));const mc=override!=null?override:ST().courts;
  if(mc>0)c=Math.min(c,mc);
  return c;
}
function draw(ids,opt){
  opt=opt||{};
  const H=pairHist(opt.exclude),HS=pairHist(opt.exclude,'ses'),D=derive().R,mode=opt.mode||ST().mode;
  const ts=TS(),per=2*ts,courts=courtsFor(ids.length,opt.courts),m=courts*per;
  if(!m)return null;
  /* 1) kdo hraje: přednost mají hráči s nejméně odehranými zápasy (pauzy se střídají spravedlivě) */
  const order=ids.map(id=>({id,r:Math.random()})).sort((a,b)=>(HS.G[a.id]||0)-(HS.G[b.id]||0)||a.r-b.r).map(o=>o.id);
  const play=order.slice(0,m),rest=order.slice(m);
  const rt={};play.forEach(id=>rt[id]=D[id].rating);
  const mean=play.reduce((s,id)=>s+rt[id],0)/m;
  /* váhy: [vyrovnanost zápasu, opakování spoluhráče, opakování soupeře, tým blízko průměru (nejlepší+nejslabší)]
     padel (2 na 2): všechny čtyři složky;
     squash (1 na 1): jen vyrovnanost a opakování soupeře – při stejném soupeři vícekrát roste penalizace */
  const WT=ts>1?{bal:[3,6,2,1],str:[10,2,.5,2],rot:[.7,8,5,.3]}:{bal:[2,0,6,0],str:[8,0,1.5,0],rot:[.4,0,10,0]};
  const W=WT[mode]||WT.bal;
  const wb=W[0],wp=W[1],wo=W[2],wt=W[3];
  const sq=x=>x*x;
  function cost(a){
    let c=0;
    for(let i=0;i<m;i+=per){
      const A=a.slice(i,i+ts),B=a.slice(i+ts,i+per);
      let sa=0,sb=0;for(const x of A)sa+=rt[x];for(const y of B)sb+=rt[y];sa/=ts;sb/=ts;
      c+=wb*sq((sa-sb)/100);
      if(ts>1){
        c+=wt*(sq((sa-mean)/100)+sq((sb-mean)/100));
        c+=wp*(sq(H.P[H.k(A[0],A[1])]||0)+sq(H.P[H.k(B[0],B[1])]||0));
      }
      for(const x of A)for(const y of B)c+=wo*sq(H.O[H.k(x,y)]||0);
    }
    return c;
  }
  /* 2) kdo s kým: náhodné restarty + vylepšování výměnami hráčů */
  let best=null,bc=Infinity;
  for(let r=0;r<30;r++){
    const a=play.slice();
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}
    let c=cost(a);
    for(let s=0;s<1500;s++){
      const i=Math.floor(Math.random()*m),j=Math.floor(Math.random()*m);
      if(i===j)continue;
      let t=a[i];a[i]=a[j];a[j]=t;
      const c2=cost(a);
      if(c2<=c)c=c2;else{t=a[i];a[i]=a[j];a[j]=t}
    }
    if(c<bc){bc=c;best=a.slice()}
  }
  const matches=[];
  for(let i=0;i<m;i+=per){
    const byR=(x,y)=>rt[y]-rt[x];
    matches.push({id:uid(),a:best.slice(i,i+ts).sort(byR),b:best.slice(i+ts,i+per).sort(byR),sa:null,sb:null});
  }
  const tot=mm=>mm.a.concat(mm.b).reduce((s,id)=>s+rt[id],0);
  matches.sort((x,y)=>tot(y)-tot(x));   /* kurt 1 = nejsilnější hráči */
  return{matches,rest};
}

/* =====================  POMOCNÉ UI  ===================== */
const ACT={},CH={};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
function modal(h){const m=$('#modal');m.innerHTML='<div class="sheet">'+h+'</div>';m.classList.remove('hidden')}
function closeModal(){const m=$('#modal');m.classList.add('hidden');m.innerHTML=''}
const modalOpen=()=>!$('#modal').classList.contains('hidden');
function download(name,text,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));
  a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
const pctOf=o=>o.g?(o.w+o.d/2)/o.g:-1;
const sign=n=>(n>=0?'+':'')+Math.round(n);
function seg(items,cur,act){
  return'<div class="seg">'+items.map(i=>`<button class="${i[0]===cur?'on':''}" data-act="${act}" data-v="${i[0]}">${i[1]}</button>`).join('')+'</div>';
}
function spark(h){
  if(h.length<2)return'<p class="mut"><small>Graf vývoje ratingu se zobrazí po prvním odehraném zápase.</small></p>';
  const mn=Math.min.apply(null,h),mx=Math.max.apply(null,h),W=300,Hh=70;
  const pts=h.map((v,i)=>((i/(h.length-1))*W).toFixed(1)+','+(Hh-6-(mx===mn?.5:(v-mn)/(mx-mn))*(Hh-12)).toFixed(1)).join(' ');
  return`<svg class="spark" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--pri)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}

const VIEW={};
const sesRounds=()=>S.rounds.filter(r=>r.sid===S.cur);
const latestRound=()=>{const l=sesRounds();return l[l.length-1]};
const pl=n=>n===1?'kurt':n>=2&&n<=4?'kurty':'kurtů';
const emptyBox=(ico,txt,btn)=>`<div class="empty"><div class="big">${ico}</div><p>${txt}</p>${btn||''}</div>`;
const MODES=[['bal','Vyvážené'],['str','Vyrovnanost'],['rot','Střídání']];
const MODE_HINT={
  bal:'Nejsilnější hráč jde s nejslabším, dva průměrní spolu – týmy jsou vyrovnané a zároveň se střídají spoluhráči i soupeři.',

const MODE_HINT_SQ={

  str:'Důraz na co nejvyrovnanější zápasy – hráči podobné síly proti sobě.',

const modeHint=()=>(S.sport==='squash'?MODE_HINT_SQ:MODE_HINT)[ST().mode];

function slot(rd,pos,val){
  const p=pos.split('.'),isM=p[0]==='m';
  const arr=isM?rd.matches[+p[1]][p[2]]:rd.rest,i=isM?+p[3]:+p[1];
  if(val===undefined)return arr[i];
  arr[i]=val;
}
const matchOfPos=(rd,pos)=>{const p=pos.split('.');return p[0]==='m'?rd.matches[+p[1]]:null};

function chip(id,rid,pos,D,delta){
  const r=Math.round(D.R[id].rating);
  const sel=UI.sel&&UI.sel.r===rid&&UI.sel.pos===pos;
  const dl=delta!=null?` <span class="${delta>=0?'up':'down'}">${sign(delta)}</span>`:'';
  return`<button class="chip ${sel?'sel':''}" data-act="pick" data-r="${rid}" data-pos="${pos}"><span class="n">${esc(nm(id))}</span><small>${r}${dl}</small></button>`;
}
function matchHTML(rd,m,mi,D){
  const sc=isScored(m),win=sc&&m.sa>m.sb?'a':sc&&m.sb>m.sa?'b':'';
  const ra=avgR(m.a,D.R),rb=avgR(m.b,D.R);
  const pa=Math.round(100/(1+Math.pow(10,(rb-ra)/400)));
  const team=(side)=>`<div class="team ${win===side?'win':''}">`+m[side].map((id,i)=>chip(id,rd.id,`m.${mi}.${side}.${i}`,D,sc&&D.DM[m.id]?D.DM[m.id][id]:null)).join('')+'</div>';
  const inp=(s)=>`<input type="number" inputmode="numeric" min="0" max="99" data-ch="score" data-r="${rd.id}" data-m="${m.id}" data-s="${s}" value="${m['s'+s]==null?'':m['s'+s]}" aria-label="Skóre">`;
  return`<div class="card match" id="mt-${m.id}"><div class="mh"><b>Kurt ${mi+1}</b><small class="mut">šance na výhru ${pa} : ${100-pa} %</small></div>
  <div class="teams">${team('a')}<span class="mut">vs</span>${team('b')}</div>
  <div class="score" style="justify-content:center;margin-top:10px">${inp('a')}<b>:</b>${inp('b')}</div></div>`;
}
function roundHTML(rd,idx,D,latest){
  const open=UI.open[rd.id]!==undefined?UI.open[rd.id]:latest;
  const done=rd.matches.filter(isScored).length;
  let h=`<details class="rd" data-rid="${rd.id}" ${open?'open':''}><summary>Kolo ${idx+1} <small class="mut">· výsledky ${done}/${rd.matches.length}</small></summary>`;
  h+=rd.matches.map((m,i)=>matchHTML(rd,m,i,D)).join('');
  if(rd.rest.length)h+=`<div class="card rest"><small class="mut">😴 Odpočívají</small><div>${rd.rest.map((id,i)=>chip(id,rd.id,'r.'+i,D,null)).join('')}</div></div>`;
  if(latest&&!rd.matches.some(isScored))h+='<p class="mut"><small>Hráče můžeš prohodit: klepni na jednoho a potom na druhého.</small></p>';
  h+=`<div class="row gap"><button class="btn ghost sm" data-act="copyRound" data-r="${rd.id}">📋 Zkopírovat</button><button class="btn ghost sm" data-act="delRound" data-r="${rd.id}">🗑 Smazat kolo</button></div></details>`;
  return h;
}
VIEW.round=()=>{
  const D=derive(),all=livePl(),on=ON(),n=all.filter(p=>p[on]).length,need=2*TS();
  if(!all.length)return emptyBox('👥','Zatím tu nejsou žádní hráči. Nejdřív je přidej.',
    '<button class="btn" data-act="addP">+ Přidat hráče</button><button class="btn ghost" data-act="demo">Vyzkoušet na ukázkových hráčích</button>');
  const courts=courtsFor(n),rs=sesRounds(),last=rs[rs.length-1];
  const replace=last&&!last.matches.some(isScored);
  const label=!last?'🎲 Losovat první kolo':replace?'🔀 Přelosovat kolo':'🎲 Losovat další kolo';
  let h=`<div class="card"><div class="row between"><div><b>${n}</b> z ${all.length} hráčů je dostupných<br><small class="mut">${n<need?'Potřeba aspoň '+need+' hráči':courts+' '+pl(courts)+', '+(n-courts*need>0?(n-courts*need)+' odpočívá':'nikdo neodpočívá')}</small></div>
  <button class="btn ghost sm" data-act="tab" data-v="players">Vybrat</button></div>
  <div class="tb"></div>${seg(MODES,ST().mode,'mode')}<small class="mut">${modeHint()}</small>
  <button class="btn big" data-act="draw" ${n<need?'disabled':''}>${label}</button></div>`;
  if(!rs.length)return h+emptyBox(SPd().ico,'Zatím žádné kolo. Klepni na „Losovat“.');
  for(let i=rs.length-1;i>=0;i--)h+=roundHTML(rs[i],i,D,i===rs.length-1);
  return h;
};

function ladderTable(D){
  const src=UI.scope==='ses'?D.SS:D.R;
  const rows=livePl().map(p=>src[p.id]).filter(x=>x.g>0);
  const cmp={pts:(a,b)=>b.pts-a.pts||b.rating-a.rating,rt:(a,b)=>b.rating-a.rating||b.pts-a.pts,wr:(a,b)=>pctOf(b)-pctOf(a)||b.g-a.g||b.rating-a.rating}[UI.sort];
  rows.sort(cmp);
  let h=seg([['pts','Body'],['rt','Rating'],['wr','Úspěšnost']],UI.sort,'lsort');
  if(!rows.length)return h+emptyBox('🏆',UI.scope==='ses'?'V tomto dni zatím není žádný výsledek.':'Zatím žádné odehrané zápasy.');
  h+='<div class="card scroll"><table class="lad"><tr><th>#</th><th style="text-align:left">Hráč</th><th>Záp</th><th>V-R-P</th><th>Body</th><th>Rating</th></tr>';
  rows.forEach((x,i)=>{
    const ch=UI.scope==='ses'&&x.rstart!=null?x.rating-x.rstart:null;
    h+=`<tr data-act="detail" data-id="${x.id}"><td>${['🥇','🥈','🥉'][i]||i+1}</td><td class="l">${esc(nm(x.id))}</td><td>${x.g}</td><td>${x.w}-${x.d}-${x.l}</td><td><b>${Math.round(x.pts*10)/10}</b></td>
    <td>${Math.round(x.rating)}${ch!=null?` <small class="${ch>=0?'up':'down'}">${sign(ch)}</small>`:''}</td></tr>`;
  });
  return h+'</table></div><p class="mut"><small>Body: '+ST().win+' za výhru, '+ST().draw+' za remízu, '+ST().loss+' za prohru'+(ST().perPt?', +'+ST().perPt+' za '+SPd().unit:'')+'. Klepnutím na hráče uvidíš detail.</small></p>';
}
function matrix(kind){
  const H=pairHist(null,UI.scope==='ses'?'ses':'all'),M=kind==='opp'?H.O:H.P,R=derive().R;
  const L=livePl().sort((a,b)=>R[b.id].rating-R[a.id].rating);
  if(L.length<2)return emptyBox('👥','Potřeba aspoň dva hráči.');
  let cov=0,tot=0;
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){tot++;if(M[H.k(L[i].id,L[j].id)])cov++}
  const cls=v=>v===0?'h0':v===1?'h1':'h2',sh=s=>s.length>9?s.slice(0,8)+'…':s;
  let h=`<div class="card"><b>${kind==='opp'?'Proti sobě':'Spolu v týmu'}:</b> ${cov} z ${tot} dvojic (${tot?Math.round(cov/tot*100):0} %)
  <div class="legend mt"><span class="h0">ještě ne</span><span class="h1">1×</span><span class="h2">2× a víc</span></div></div>
  <div class="card scroll"><table class="hm"><tr><th></th>${L.map(p=>`<th class="v">${esc(sh(p.name))}</th>`).join('')}</tr>`;
  L.forEach(a=>{
    h+=`<tr><th class="r">${esc(sh(a.name))}</th>`+L.map(b=>{
      if(a.id===b.id)return'<td class="hx">·</td>';
      const v=M[H.k(a.id,b.id)]||0;return`<td class="${cls(v)}">${v}</td>`}).join('')+'</tr>';
  });
  return h+'</table></div>';
}
VIEW.ladder=()=>{
  const D=derive(),sub=TS()>1?UI.lsub:(UI.lsub==='par'?'ladder':UI.lsub);
  const tabs=[['ladder','🏆 Žebříček'],['opp','⚔️ Soupeři']];if(TS()>1)tabs.push(['par','🤝 Spoluhráči']);
  return seg([['ses','Tento den'],['all','Celkově']],UI.scope,'scope')
   +seg(tabs,sub,'lsub')
   +(sub==='ladder'?ladderTable(D):matrix(sub));
};

  <div class="card"><h3>⚠️ Nebezpečná zóna</h3><button class="btn danger" data-act="reset">Smazat všechna data</button></div>`;
  return h;
};

function render(){
  const y=window.scrollY;
  const cs=curSes();
  document.body.classList.toggle('squash',S.sport==='squash');
  $('#title').textContent=SPd().ico+' '+(cs?cs.name:SPd().name);
  $('#sp').innerHTML=Object.keys(SPORTS).map(k=>`<button class="${k===S.sport?'on':''}" data-act="sport" data-v="${k}">${SPORTS[k].name}</button>`).join('');
  const tb=document.querySelector('#tabs button[data-t="round"]');if(tb)tb.innerHTML='<span>'+SPd().ico+'</span>Kolo';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===UI.tab));
  $('#view').innerHTML=VIEW[UI.tab]();
  window.scrollTo(0,y);
}
function textModal(title,text){
  modal(`<h2>${esc(title)}</h2><textarea id="ta" rows="12" readonly>${esc(text)}</textarea>
  <button class="btn" data-act="copyTxt">📋 Kopírovat</button>${navigator.share?'<button class="btn ghost" data-act="shareTxt">📤 Sdílet…</button>':''}
  <button class="btn ghost" data-act="closeModal">Zavřít</button>`);
}
function copyText(t){
  const ok=()=>toast('Zkopírováno');
  const fb=()=>{const ta=$('#ta');if(ta){ta.select();try{document.execCommand('copy');ok()}catch(e){toast('Text označ a zkopíruj ručně')}}};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,fb);else fb();
}
function roundText(rd){
  const i=sesRounds().indexOf(rd)+1;
  let t=`${SPd().name} – ${curSes().name}, kolo ${i}\n`;
  rd.matches.forEach((m,k)=>{t+=`\nKurt ${k+1}: ${tName(m.a)}  vs  ${tName(m.b)}`+(isScored(m)?`  (${m.sa}:${m.sb})`:'')});
  if(rd.rest.length)t+=`\n\nOdpočívají: ${rd.rest.map(nm).join(', ')}`;
  return t;
}
function ladderText(){
  const D=derive(),src=UI.scope==='ses'?D.SS:D.R;
  const rows=livePl().map(p=>src[p.id]).filter(x=>x.g>0).sort((a,b)=>b.pts-a.pts||b.rating-a.rating);
  let t=SPd().name+' – žebříček – '+(UI.scope==='ses'?curSes().name:'celkově')+'\n';
  rows.forEach((x,i)=>{t+=`\n${i+1}. ${nm(x.id)} – ${Math.round(x.pts*10)/10} b., ${x.w}V-${x.d}R-${x.l}P, rating ${Math.round(x.rating)}`});
  return t;
}

ACT.draw=()=>{
  const ids=livePl().filter(p=>p[ON()]).map(p=>p.id);
  const rs=sesRounds(),last=rs[rs.length-1],rep=last&&!last.matches.some(isScored);
  const res=draw(ids,{exclude:rep?last.id:null});
  if(!res){toast('Je potřeba aspoň '+(2*TS())+' dostupní hráči');return}
  if(rep){last.matches=res.matches;last.rest=res.rest;UI.open[last.id]=true}
  else{
    if(last)UI.open[last.id]=false;
    const rd={id:uid(),sid:S.cur,ts:Date.now(),matches:res.matches,rest:res.rest};
    S.rounds.push(rd);UI.open[rd.id]=true;
  }
  UI.sel=null;save();render();window.scrollTo(0,0);
};
ACT.pick=d=>{
  const rd=S.rounds.find(r=>r.id===d.r);if(!rd)return;
  if(!UI.sel||UI.sel.r!==d.r){UI.sel={r:d.r,pos:d.pos};render();return}
  if(UI.sel.pos===d.pos){UI.sel=null;render();return}
  const m1=matchOfPos(rd,UI.sel.pos),m2=matchOfPos(rd,d.pos);
  if((m1&&isScored(m1))||(m2&&isScored(m2))){toast('Zápas s výsledkem už nejde měnit');UI.sel=null;render();return}
  const a=slot(rd,UI.sel.pos),b=slot(rd,d.pos);
  slot(rd,UI.sel.pos,b);slot(rd,d.pos,a);
  UI.sel=null;save();render();
};
ACT.delRound=d=>{if(!confirm('Smazat toto kolo včetně výsledků? Rating se přepočítá.'))return;S.rounds=S.rounds.filter(r=>r.id!==d.r);save();render()};

ACT.copyTxt=()=>copyText($('#ta').value);
ACT.shareTxt=()=>navigator.share({text:$('#ta').value}).catch(()=>{});
CH.score=t=>{
  const rd=S.rounds.find(r=>r.id===t.dataset.r),m=rd&&rd.matches.find(x=>x.id===t.dataset.m);if(!m)return;
  const v=t.value.trim(),was=isScored(m);
  m['s'+t.dataset.s]=v===''?null:Math.max(0,Math.min(99,parseInt(v,10)||0));
  save();
  if(was||isScored(m))render();   /* překreslit až když je výsledek úplný (nebo se maže) */
};
CH.on=t=>{const p=P(t.dataset.id);if(p){p[ON()]=t.checked;save();render()}};
CH.set=t=>{
  const k=t.dataset.k,st=ST();
  if(k==='hist')st.hist=t.value;
  else{let v=parseFloat(String(t.value).replace(',','.'));if(isNaN(v)||v<0)v=DSET()[k];st[k]=k==='courts'?Math.floor(v):v}
  save();render();
};

CH.lvl2=t=>{$('#pr2').value=t.value};

/* hráči */
ACT.addP=()=>{
  modal(`<h2>Přidat hráče</h2><label>Jména (každé na nový řádek)</label><textarea id="pnames" rows="5" placeholder="Petr&#10;Jana&#10;Tomáš"></textarea>
  <label>Úroveň (výchozí rating pro oba sporty, jde změnit u hráče)</label><select id="plvl">${LEVELS.map(l=>`<option value="${l[1]}" ${l[1]===1000?'selected':''}>${l[0]} (${l[1]})</option>`).join('')}</select>
  <button class="btn" data-act="saveNew">Přidat</button><button class="btn ghost" data-act="closeModal">Zrušit</button>`);
};
ACT.saveNew=()=>{
  const names=$('#pnames').value.split(/\n|,|;/).map(s=>s.trim()).filter(Boolean),r0=+$('#plvl').value;
  if(!names.length){toast('Zadej aspoň jedno jméno');return}
  let added=0,dup=0;
  names.forEach(n=>{
    if(S.players.some(p=>p.name.toLowerCase()===n.toLowerCase())){dup++;return}
    S.players.push({id:uid(),name:n,r0,r0s:r0,on:S.sport==='padel',on2:S.sport==='squash',arch:false});added++;
  });
  save();closeModal();render();
  toast('Přidáno: '+added+(dup?' (duplicitních jmen přeskočeno: '+dup+')':''));
};
ACT.demo=()=>{
  [['Adam',1200],['Petr',1150],['Martin',1100],['Jana',1050],['Tomáš',1000],['Honza',1000],['Eva',950],['Lucie',900],['Kuba',850],['Klára',800]]
   .forEach(x=>S.players.push({id:uid(),name:x[0],r0:x[1],r0s:x[1],on:true,on2:true,arch:false}));

ACT.editP=d=>{
  const p=P(d.id);if(!p)return;
  /* rating a počet zápasů v obou sportech (derive počítá pro aktuální sport, proto se dočasně přepne) */
  const was=S.sport,info={};
  ['padel','squash'].forEach(sp=>{S.sport=sp;const D=derive();info[sp]={r:Math.round(D.R[p.id].rating),g:D.R[p.id].g}});
  S.sport=was;
  const games=info.padel.g+info.squash.g;
  const lvl=ch=>`<select data-ch="${ch}"><option value="">– rychlý výběr úrovně –</option>${LEVELS.map(l=>`<option value="${l[1]}">${l[0]} (${l[1]})</option>`).join('')}</select>`;
  modal(`<h2>${esc(p.name)}</h2><label>Jméno</label><input id="pn" value="${esc(p.name)}">
  <label>🎾 Padel – výchozí rating <small>(aktuální: ${info.padel.r}, zápasů ${info.padel.g})</small></label>
  ${lvl('lvl')}<input id="pr" type="number" inputmode="numeric" value="${p.r0}" style="margin-top:6px">
  <label>⚫ Squash – výchozí rating <small>(aktuální: ${info.squash.r}, zápasů ${info.squash.g})</small></label>
  ${lvl('lvl2')}<input id="pr2" type="number" inputmode="numeric" value="${p.r0s!=null?p.r0s:p.r0}" style="margin-top:6px">
  <p class="mut"><small>Změna výchozího ratingu přepočítá celý vývoj ratingu hráče v daném sportu.</small></p>
  <button class="btn" data-act="saveP" data-id="${p.id}">Uložit</button>
  <button class="btn ghost" data-act="archP" data-id="${p.id}">${p.arch?'♻️ Obnovit mezi hráče':'🙈 Skrýt (zachová historii)'}</button>
  ${games===0?`<button class="btn danger" data-act="delP" data-id="${p.id}">Smazat hráče</button>`:''}
  <button class="btn ghost" data-act="closeModal">Zavřít</button>`);
};
ACT.saveP=d=>{
  const p=P(d.id),n=$('#pn').value.trim(),r=parseFloat($('#pr').value),r2=parseFloat($('#pr2').value);
  if(!n){toast('Jméno nesmí být prázdné');return}
  if(S.players.some(q=>q.id!==p.id&&q.name.toLowerCase()===n.toLowerCase())){toast('Takové jméno už existuje');return}
  p.name=n;if(!isNaN(r))p.r0=r;if(!isNaN(r2))p.r0s=r2;
  save();closeModal();render();
};
ACT.archP=d=>{const p=P(d.id);p.arch=!p.arch;if(p.arch){p.on=false;p.on2=false}save();closeModal();render()};
ACT.delP=d=>{S.players=S.players.filter(p=>p.id!==d.id);save();closeModal();render()};
ACT.detail=d=>{
  const D=derive(),p=P(d.id),a=D.R[p.id],s=D.SS[p.id];
  const rank=livePl().filter(q=>D.R[q.id].g>0).sort((x,y)=>D.R[y.id].rating-D.R[x.id].rating).findIndex(q=>q.id===p.id)+1;
  const pick=(o,best)=>{
    const arr=Object.keys(o).filter(k=>o[k].g>=2&&P(k)).map(k=>({id:k,g:o[k].g,pc:o[k].w/o[k].g}));
    if(!arr.length)return'<span class="mut">zatím málo zápasů</span>';
    arr.sort((x,y)=>best?y.pc-x.pc||y.g-x.g:x.pc-y.pc||y.g-x.g);
    const x=arr[0];return`${esc(nm(x.id))} <small class="mut">(${Math.round(x.pc*100)} % z ${x.g})</small>`;
  };
  modal(`<h2>${esc(p.name)} <small class="mut">${SPd().ico} ${SPd().name}</small></h2>
  <div class="stats"><div><b>${Math.round(a.rating)}</b><small>rating${rank?' · #'+rank:''}</small></div><div><b>${Math.round(a.pts*10)/10}</b><small>bodů celkem</small></div><div><b>${a.g?Math.round(pctOf(a)*100)+' %':'–'}</b><small>úspěšnost</small></div>
  <div><b>${a.w}-${a.d}-${a.l}</b><small>V-R-P</small></div><div><b>${a.gf}:${a.ga}</b><small>skóre</small></div><div><b>${s.g}</b><small>zápasů tento den</small></div></div>
  ${TS()>1?`<p>🤝 Nejlepší spoluhráč: ${pick(a.pw,true)}</p>`:''}<p>😬 Nejtěžší soupeř: ${pick(a.ow,false)}</p>
  <h3 class="mt">Vývoj ratingu</h3>${spark(a.hist)}
  <button class="btn ghost" data-act="editP" data-id="${p.id}">✏️ Upravit hráče</button><button class="btn ghost" data-act="closeModal">Zavřít</button>`);
};

/* Dropbox (OAuth PKCE – bez tajného klíče; aplikace v Dropboxu má mít typ „App folder“) */
const DBX_LS='padel_dbx',DBX_FILE='/padel-data.json',DBX_TOKEN='https://api.dropboxapi.com/oauth2/token';
const dbx=()=>{try{return JSON.parse(localStorage.getItem(DBX_LS))||{}}catch(e){return{}}};
const dbxSet=o=>localStorage.setItem(DBX_LS,JSON.stringify(Object.assign(dbx(),o)));
const dbxRedirect=()=>location.origin+location.pathname;
const b64u=buf=>btoa(String.fromCharCode.apply(null,new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const fmtTs=ms=>ms?new Date(ms).toLocaleString('cs-CZ'):'neznámo';

ACT.dbx=()=>{
  const c=dbx(),on=!!c.refresh;
  let h='<h2>☁️ Záloha na Dropbox</h2>';
  if(!on){
    h+=`<p class="mut"><small><b>Jednorázové nastavení:</b><br>1. Na dropbox.com/developers/apps vytvoř aplikaci (Scoped access → <b>App folder</b>).<br>2. V záložce Permissions zapni <b>files.content.write</b> a <b>files.content.read</b>.<br>3. V záložce Settings přidej do <b>Redirect URIs</b> přesně tuto adresu:</small></p>
    <input readonly value="${esc(dbxRedirect())}" onclick="this.select()">
    <p class="mut"><small>4. Zkopíruj <b>App key</b> (tajný „App secret“ nepotřebuješ) a vlož ho sem:</small></p>
    <input id="dk" placeholder="App key" value="${esc(c.key||'')}" autocapitalize="off" autocorrect="off">
    <button class="btn" data-act="dbxConnect">Připojit Dropbox</button>
    <div class="tb"></div><p class="mut"><small>Máš kód připojení od spoluhráče?</small></p>
    <button class="btn ghost" data-act="dbxPaste">🔑 Vložit kód připojení</button>`;
  }else{
    h+=`<p class="ok">✔ Dropbox je připojen</p><p class="mut"><small>Soubor: Aplikace/…/padel-data.json (ve složce aplikace na Dropboxu)<br>Poslední nahrání z tohoto telefonu: ${fmtTs(c.last)}<br>Poslední změna dat v tomto telefonu: ${fmtTs(S.mod)}</small></p>
    <button class="btn" data-act="dbxUp">⬆️ Nahrát zálohu na Dropbox</button>
    <button class="btn ghost" data-act="dbxDown">⬇️ Stáhnout zálohu z Dropboxu</button>
    <button class="btn ghost" data-act="dbxShare">🔑 Kód připojení pro spoluhráče</button>
    <button class="btn ghost" data-act="dbxOff">Odpojit</button>`;
  }
  modal(h+'<button class="btn ghost" data-act="closeModal">Zavřít</button>');
};
ACT.dbxConnect=async()=>{
  const key=$('#dk').value.trim();
  if(!key){toast('Vyplň App key');return}
  if(!(window.crypto&&crypto.subtle)){toast('Potřeba HTTPS adresa (např. GitHub Pages)');return}
  const ver=b64u(crypto.getRandomValues(new Uint8Array(48)));
  const chal=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
  dbxSet({key,ver});
  location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:key,response_type:'code',code_challenge:chal,code_challenge_method:'S256',token_access_type:'offline',redirect_uri:dbxRedirect()});
};
/* po návratu z Dropboxu vymění kód za trvalý token */
async function dbxReturn(){
  const q=new URLSearchParams(location.search);
  if(!q.has('code')&&!q.has('error'))return false;
  const code=q.get('code'),c=dbx();
  history.replaceState(null,'',location.pathname);
  if(!code||!c.ver){if(q.has('error'))toast('Připojení Dropboxu bylo zrušeno');return false}
  try{
    const r=await fetch(DBX_TOKEN,{method:'POST',body:new URLSearchParams({code,grant_type:'authorization_code',client_id:c.key,code_verifier:c.ver,redirect_uri:dbxRedirect()})});
    const j=await r.json();
    if(!j.refresh_token)throw new Error(j.error_description||j.error||'bez odpovědi');
    dbxSet({refresh:j.refresh_token,ver:null,access:j.access_token,exp:Date.now()+(j.expires_in-60)*1000});
    toast('Dropbox připojen ✔');return true;
  }catch(e){toast('Připojení se nezdařilo: '+e.message);return false}
}
async function dbxToken(){
  const c=dbx();
  if(!c.refresh)throw new Error('Dropbox není připojen');
  if(c.access&&c.exp>Date.now())return c.access;
  const r=await fetch(DBX_TOKEN,{method:'POST',body:new URLSearchParams({grant_type:'refresh_token',refresh_token:c.refresh,client_id:c.key})});
  const j=await r.json();
  if(!j.access_token)throw new Error('přihlášení vypršelo, připoj Dropbox znovu');
  dbxSet({access:j.access_token,exp:Date.now()+(j.expires_in-60)*1000});
  return j.access_token;
}
async function dbxGet(){   /* vrací data ze zálohy, nebo null když ještě neexistuje */
  const t=await dbxToken();
  const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+t,'Dropbox-API-Arg':JSON.stringify({path:DBX_FILE})}});
  if(r.status===409)return null;
  if(!r.ok)throw new Error('chyba '+r.status);
  return JSON.parse(await r.text());
}
ACT.dbxUp=async()=>{
  try{
    toast('Nahrávám…');
    const rem=await dbxGet();
    if(rem&&(rem.mod||0)>(S.mod||0)&&!confirm('Na Dropboxu je novější záloha ('+fmtTs(rem.mod)+') než data v tomto telefonu ('+fmtTs(S.mod)+'). Přesto ji přepsat?'))return;
    const t=await dbxToken();
    const r=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/octet-stream','Dropbox-API-Arg':JSON.stringify({path:DBX_FILE,mode:'overwrite',mute:true})},body:JSON.stringify(S)});
    if(!r.ok)throw new Error('chyba '+r.status);
    dbxSet({last:Date.now()});toast('Nahráno na Dropbox ✔');ACT.dbx();
  }catch(e){toast('Dropbox: '+e.message)}
};
ACT.dbxDown=async()=>{
  try{
    toast('Stahuji…');
    const rem=await dbxGet();
    if(!rem){toast('Na Dropboxu zatím není žádná záloha');return}
    if(!confirm('Nahradit data v tomto telefonu zálohou z Dropboxu?\nZáloha: '+(rem.players||[]).length+' hráčů, '+(rem.rounds||[]).length+' kol, změněno '+fmtTs(rem.mod)+'.\nTento telefon: změněno '+fmtTs(S.mod)+'.'))return;
    applyData(rem);closeModal();toast('Data načtena z Dropboxu');
  }catch(e){toast('Dropbox: '+e.message)}
};
ACT.dbxOff=()=>{if(!confirm('Odpojit Dropbox od tohoto telefonu? Záloha na Dropboxu zůstane.'))return;localStorage.removeItem(DBX_LS);ACT.dbx()};
ACT.dbxShare=()=>{
  const c=dbx();
  modal(`<h2>🔑 Kód připojení</h2>
  <p class="mut"><small>Kdo tento kód vloží do své aplikace, bude moct číst a přepisovat zálohu na tvém Dropboxu (jen ve složce této aplikace, ne jiné soubory). Posílej ho jen lidem, kterým věříš. Přístup zrušíš v Dropboxu: Nastavení → Zabezpečení → Propojené aplikace.</small></p>
  <textarea id="ta" rows="4" readonly>${esc(btoa(JSON.stringify({key:c.key,refresh:c.refresh})))}</textarea>
  <button class="btn" data-act="copyTxt">📋 Kopírovat</button><button class="btn ghost" data-act="dbx">Zpět</button>`);
};
ACT.dbxPaste=()=>{
  modal(`<h2>🔑 Vložit kód připojení</h2><textarea id="dcode" rows="4" placeholder="Sem vlož kód"></textarea>
  <button class="btn" data-act="dbxPasteOk">Připojit</button><button class="btn ghost" data-act="dbx">Zpět</button>`);
};
ACT.dbxPasteOk=()=>{
  try{
    const j=JSON.parse(atob($('#dcode').value.trim()));
    if(!j.key||!j.refresh)throw 0;
    dbxSet({key:j.key,refresh:j.refresh,access:null,exp:0,ver:null});
    toast('Dropbox připojen ✔');ACT.dbx();
  }catch(e){toast('Kód není platný')}
};

/* =====================  UDÁLOSTI A START  ===================== */
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return}
  const t=e.target.closest('[data-act]');
  if(!t||t.tagName==='INPUT')return;
  const f=ACT[t.dataset.act];if(f)f(t.dataset,t,e);
});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-ch]');
  if(t&&CH[t.dataset.ch])CH[t.dataset.ch](t);
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.rid)UI.open[d.dataset.rid]=d.open},true);
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)ACT.tab({v:b.dataset.t})});
$('#file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{const j=JSON.parse(rd.result);
      if(!confirm('Nahradit současná data zálohou ('+(j.players||[]).length+' hráčů, '+(j.rounds||[]).length+' kol)?'))return;
      applyData(j);toast('Záloha nahrána');
    }catch(err){toast('Chyba: '+err.message)}
  };
  rd.readAsText(f);
});
render();
dbxReturn().then(ok=>{if(ok){UI.tab='more';render();ACT.dbx()}});

/* =====================  INSTALACE JAKO APLIKACE (PWA)  ===================== */
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});   /* ochrana dat před automatickým mazáním */
